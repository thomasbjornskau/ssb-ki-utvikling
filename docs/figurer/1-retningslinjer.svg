<text x="1468" y="232" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#274247" text-anchor="start">Fire ting å merke seg</text>
<circle cx="1484" cy="283" r="17" fill="#274247"/>
<text x="1484" y="289" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="1514" y="290" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Dataene bestemmer</text>
<text x="1514" y="318" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Spør først hvilket nivå dataene</text>
<text x="1514" y="342" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">har. Et godkjent verktøy gjør ikke</text>
<text x="1514" y="366" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">taushetsbelagte data trygge.</text>
<circle cx="1484" cy="409" r="17" fill="#274247"/>
<text x="1484" y="415" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="1514" y="416" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Taushetsbelagt: nei i dag</text>
<text x="1514" y="444" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Ingen av verktøyene er godkjent</text>
<text x="1514" y="468" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">for mikrodata. Om det skal finnes</text>
<text x="1514" y="492" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">en egen løsning, er uavklart.</text>
<circle cx="1484" cy="535" r="17" fill="#274247"/>
<text x="1484" y="541" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="1514" y="542" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Før publisering</text>
<text x="1514" y="570" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Upubliserte tall er taushets-</text>
<text x="1514" y="594" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">belagte, uansett hvor aggregerte</text>
<text x="1514" y="618" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">de er.</text>
<circle cx="1484" cy="661" r="17" fill="#274247"/>
<text x="1484" y="667" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="1514" y="668" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Private abonnement</text>
<text x="1514" y="696" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Nei også for åpne data. Grunnen</text>
<text x="1514" y="720" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">er avtalen, ikke dataene.</text>
