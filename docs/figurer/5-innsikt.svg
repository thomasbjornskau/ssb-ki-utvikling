<text x="998.0" y="585.7" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">bruk, kostnad,</text>
<text x="998.0" y="607.7" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">erfaring, avvik</text>
