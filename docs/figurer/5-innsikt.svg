<text x="598.0" y="915.7" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">nyheter hver måned,</text>
<text x="598.0" y="937.7" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">halvårlig gjennomgang</text>
