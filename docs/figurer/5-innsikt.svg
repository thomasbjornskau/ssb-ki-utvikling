<text x="1860" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="end">26.11.2026 · Versjon 2.1, skisse til diskusjon · KI-gruppen, avdeling 700</text>
<rect x="580.0" y="190.0" width="300" height="120" rx="2" fill="#f2f0ff" stroke="#7e5ee8" stroke-width="1"/>
<text x="598.0" y="228.5" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#4b2fb0" text-anchor="start">Bruk</text>
<text x="598.0" y="255.7" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">i seksjonene og teamene</text>
