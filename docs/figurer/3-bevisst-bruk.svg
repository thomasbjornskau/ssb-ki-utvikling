<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
<text x="60" y="92" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="46" font-weight="700" fill="#274247" text-anchor="start">Grønn og rød sone i statistikkarbeid</text>
<text x="60" y="136" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#5e787a" text-anchor="start">Hvor KI sparer tid, og hvor det å gjøre jobben selv er selve verdien</text>
<rect x="1740.2" y="64" width="119.8" height="34" rx="17" fill="#ffffff" stroke="#274247" stroke-width="1"/>
<text x="1800.1000000000001" y="87" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#274247" text-anchor="middle">Diskusjon</text>
<rect x="1620.6000000000001" y="64" width="109.6" height="34" rx="17" fill="#ffffff" stroke="#274247" stroke-width="1"/>
<text x="1675.4" y="87" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#274247" text-anchor="middle">Oversikt</text>
<line x1="60" y1="160" x2="1860" y2="160" stroke="#c3dcdc" stroke-width="1"/>
<rect x="1440" y="180" width="420" height="806" rx="2" fill="#f0f8f9" stroke="none" stroke-width="0"/>
<rect x="1440" y="180" width="420" height="5" rx="0" fill="#00824d" stroke="none" stroke-width="0"/>
<text x="1468" y="232" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#274247" text-anchor="start">Slik bruker du skillet</text>
<circle cx="1484" cy="283" r="17" fill="#274247"/>
<text x="1484" y="289" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="1514" y="290" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Grønn sone: la KI gjøre det</text>
<text x="1514" y="318" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Du vet hva svaret skal bli,</text>
<text x="1514" y="342" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">og ser raskt om det er riktig.</text>
<circle cx="1484" cy="385" r="17" fill="#274247"/>
<text x="1484" y="391" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="1514" y="392" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Rød sone: gjør det selv først</text>
<text x="1514" y="420" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Her bygges forståelsen av</text>
<text x="1514" y="444" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">statistikken. KI kan støtte,</text>
<text x="1514" y="468" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">men ikke tenke for deg.</text>
<circle cx="1484" cy="511" r="17" fill="#274247"/>
<text x="1484" y="517" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="1514" y="518" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Grensen er personlig</text>
<text x="1514" y="546" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Den flytter seg når du lærer.</text>
<text x="1514" y="570" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Nyansatte bør ha mer i rød sone.</text>
<circle cx="1484" cy="613" r="17" fill="#274247"/>
<text x="1484" y="619" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="1514" y="620" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Tre vaner</text>
<text x="1514" y="648" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Prøv selv først. Generer, så</text>
<text x="1514" y="672" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">forstå. Merk når du slutter</text>
<text x="1514" y="696" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">å forstå.</text>
<rect x="60" y="1027" width="26" height="22" rx="2" fill="#ecfeed" stroke="#00824d" stroke-width="1"/>
<text x="96" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Grønn sone: KI gjør jobben</text>
<rect x="348.40000000000003" y="1027" width="26" height="22" rx="2" fill="#f2f0ff" stroke="#7e5ee8" stroke-width="1"/>
<text x="384.40000000000003" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Rød sone: du gjør jobben</text>
<rect x="620.0" y="1027" width="26" height="22" rx="2" fill="#f0f8f9" stroke="#274247" stroke-width="1"/>
<text x="656.0" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Vane</text>
<text x="1860" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="end">26.11.2026 · Versjon 2.1, skisse til diskusjon · KI-gruppen, avdeling 700</text>
<rect x="60" y="196" width="640" height="560" rx="2" fill="#ecfeed" stroke="#00824d" stroke-width="1"/>
<rect x="60" y="196" width="640" height="5" rx="0" fill="#00824d" stroke="none" stroke-width="0"/>
<text x="88" y="248" font-family="Roboto, Arial, sans-serif" font-size="26" font-weight="700" fill="#00824d" text-anchor="start">Grønn sone</text>
<text x="88" y="280" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">KI sparer tid, du mister ikke noe du trenger</text>
<rect x="740" y="196" width="640" height="560" rx="2" fill="#f2f0ff" stroke="#7e5ee8" stroke-width="1"/>
<rect x="740" y="196" width="640" height="5" rx="0" fill="#7e5ee8" stroke="none" stroke-width="0"/>
<text x="768" y="248" font-family="Roboto, Arial, sans-serif" font-size="26" font-weight="700" fill="#4b2fb0" text-anchor="start">Rød sone</text>
<text x="768" y="280" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Den tankemessige jobben er verdien</text>
<rect x="88" y="312" width="584" height="50" rx="2" fill="#ffffff" stroke="#00824d" stroke-width="1"/>
<text x="110" y="344" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#274247" text-anchor="start">Boilerplate og oppsett</text>
<rect x="88" y="374" width="584" height="50" rx="2" fill="#ffffff" stroke="#00824d" stroke-width="1"/>
<text x="110" y="406" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#274247" text-anchor="start">Oversette syntaks fra SAS eller R</text>
<rect x="88" y="436" width="584" height="50" rx="2" fill="#ffffff" stroke="#00824d" stroke-width="1"/>
<text x="110" y="468" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#274247" text-anchor="start">Syntetiske testdata</text>
<rect x="88" y="498" width="584" height="50" rx="2" fill="#ffffff" stroke="#00824d" stroke-width="1"/>
<text x="110" y="530" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#274247" text-anchor="start">Dokumentasjon for kode du forstår</text>
<rect x="88" y="560" width="584" height="50" rx="2" fill="#ffffff" stroke="#00824d" stroke-width="1"/>
<text x="110" y="592" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#274247" text-anchor="start">Formatere og rydde kode</text>
<rect x="88" y="622" width="584" height="50" rx="2" fill="#ffffff" stroke="#00824d" stroke-width="1"/>
<text x="110" y="654" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#274247" text-anchor="start">Utkast til tester</text>
<rect x="88" y="684" width="584" height="50" rx="2" fill="#ffffff" stroke="#00824d" stroke-width="1"/>
<text x="110" y="716" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#274247" text-anchor="start">Forklare en feilmelding</text>
<rect x="768" y="312" width="584" height="50" rx="2" fill="#ffffff" stroke="#7e5ee8" stroke-width="1"/>
<text x="790" y="344" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#274247" text-anchor="start">Feilsøke et tall som ikke stemmer</text>
<rect x="768" y="374" width="584" height="50" rx="2" fill="#ffffff" stroke="#7e5ee8" stroke-width="1"/>
<text x="790" y="406" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#274247" text-anchor="start">Avgjøre om oversettelsen gir samme tall</text>
<rect x="768" y="436" width="584" height="50" rx="2" fill="#ffffff" stroke="#7e5ee8" stroke-width="1"/>
<text x="790" y="468" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#274247" text-anchor="start">Velge og begrunne metode</text>
<rect x="768" y="498" width="584" height="50" rx="2" fill="#ffffff" stroke="#7e5ee8" stroke-width="1"/>
<text x="790" y="530" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#274247" text-anchor="start">Plausibilitetskontroll av nye tall</text>
<rect x="768" y="560" width="584" height="50" rx="2" fill="#ffffff" stroke="#7e5ee8" stroke-width="1"/>
<text x="790" y="592" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#274247" text-anchor="start">Forstå en ny datakilde</text>
<rect x="768" y="622" width="584" height="50" rx="2" fill="#ffffff" stroke="#7e5ee8" stroke-width="1"/>
<text x="790" y="654" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#274247" text-anchor="start">Bestemme hva som skal testes</text>
<rect x="768" y="684" width="584" height="50" rx="2" fill="#ffffff" stroke="#7e5ee8" stroke-width="1"/>
<text x="790" y="716" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="400" fill="#274247" text-anchor="start">Kjernelogikk i produksjonsløpet</text>
<line x1="720" y1="190" x2="720" y2="768" stroke="#274247" stroke-width="2" stroke-dasharray="3 6"/>
<polyline points="720.0,778.0 680.0,778.0" fill="none" stroke="#274247" stroke-width="2" stroke-linejoin="round"/>
<polygon points="668.0,778.0 684.0,770.5 684.0,785.5" fill="#274247"/>
<polyline points="720.0,778.0 760.0,778.0" fill="none" stroke="#274247" stroke-width="2" stroke-linejoin="round"/>
<polygon points="772.0,778.0 756.0,785.5 756.0,770.5" fill="#274247"/>
<text x="720" y="806" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="middle">grensen flytter seg</text>
<rect x="60" y="834" width="420" height="132" rx="2" fill="#f0f8f9" stroke="#274247" stroke-width="1"/>
<text x="82" y="876" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Vane 1</text>
<text x="82" y="908" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Prøv selv først</text>
<text x="82" y="940" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">tre forsøk før du spør</text>
<rect x="510" y="834" width="420" height="132" rx="2" fill="#f0f8f9" stroke="#274247" stroke-width="1"/>
<text x="532" y="876" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Vane 2</text>
<text x="532" y="908" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Generer, så forstå</text>
<text x="532" y="940" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">spør hvorfor, kan du forklare det?</text>
<rect x="960" y="834" width="420" height="132" rx="2" fill="#f0f8f9" stroke="#274247" stroke-width="1"/>
<text x="982" y="876" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Vane 3</text>
<text x="982" y="908" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Merk når du slutter å forstå</text>
<text x="982" y="940" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">varselet er vanen, ikke enkelttilfellet</text>
</svg>
