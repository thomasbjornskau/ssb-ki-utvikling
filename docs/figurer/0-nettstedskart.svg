<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect x="0" y="0" width="1920" height="1080" fill="#ffffff"/>
<text x="60" y="92" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="46" font-weight="700" fill="#274247" text-anchor="start">Hva nettstedet inneholder</text>
<text x="60" y="136" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="400" fill="#5e787a" text-anchor="start">Seks områder. Retningslinjene ligger under alt, tre områder fylles i første versjon</text>
<rect x="1760.6" y="64" width="99.39999999999999" height="34" rx="17" fill="#f2f0ff" stroke="#7e5ee8" stroke-width="1" stroke-dasharray="8 6"/>
<text x="1810.3" y="87" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#4b2fb0" text-anchor="middle">FORSLAG</text>
<rect x="1641.0" y="64" width="109.6" height="34" rx="17" fill="#ffffff" stroke="#274247" stroke-width="1"/>
<text x="1695.8" y="87" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#274247" text-anchor="middle">Oversikt</text>
<line x1="60" y1="160" x2="1860" y2="160" stroke="#c3dcdc" stroke-width="1"/>
<rect x="1440" y="180" width="420" height="806" rx="2" fill="#f0f8f9" stroke="none" stroke-width="0"/>
<rect x="1440" y="180" width="420" height="5" rx="0" fill="#00824d" stroke="none" stroke-width="0"/>
<text x="1468" y="232" font-family="Roboto, Arial, sans-serif" font-size="22" font-weight="700" fill="#274247" text-anchor="start">Slik leser du figuren</text>
<circle cx="1484" cy="283" r="17" fill="#274247"/>
<text x="1484" y="289" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="1514" y="290" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Grunnmuren er reglene</text>
<text x="1514" y="318" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Kom i gang og bevisst bruk bygger</text>
<text x="1514" y="342" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">på retningslinjene. De kan ikke</text>
<text x="1514" y="366" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">si noe reglene ikke sier.</text>
<circle cx="1484" cy="409" r="17" fill="#274247"/>
<text x="1484" y="415" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="1514" y="416" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">To spor for brukerne</text>
<text x="1514" y="444" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Kom i gang er praksis: hvordan.</text>
<text x="1514" y="468" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Bevisst bruk er vurdering:</text>
<text x="1514" y="492" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">når, og når ikke.</text>
<circle cx="1484" cy="535" r="17" fill="#274247"/>
<text x="1484" y="541" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="1514" y="542" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Deling og læring kommer etter</text>
<text x="1514" y="570" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Felles verktøy og innsikt får</text>
<text x="1514" y="594" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">en ramme nå og fylles når</text>
<text x="1514" y="618" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">reglene er på plass.</text>
<circle cx="1484" cy="661" r="17" fill="#274247"/>
<text x="1484" y="667" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="1514" y="668" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Gruppen holder det sammen</text>
<text x="1514" y="696" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">KI-gruppen eier ikke alt, men</text>
<text x="1514" y="720" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">sørger for at områdene henger</text>
<text x="1514" y="744" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">sammen og holdes oppdatert.</text>
<rect x="60" y="1027" width="26" height="22" rx="2" fill="#f0f8f9" stroke="#274247" stroke-width="1"/>
<text x="96" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Område i første versjon</text>
<rect x="323.20000000000005" y="1027" width="26" height="22" rx="2" fill="#ffffff" stroke="#b9c5c6" stroke-width="1" stroke-dasharray="6 5"/>
<text x="359.20000000000005" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Ramme, fylles senere</text>
<rect x="561.2" y="1027" width="26" height="22" rx="2" fill="#f2f0ff" stroke="#7e5ee8" stroke-width="1"/>
<text x="597.2" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Ansvar</text>
<polyline points="681.6,1039.0 703.6,1039.0" fill="none" stroke="#274247" stroke-width="2" stroke-linejoin="round"/>
<polygon points="715.6,1039.0 699.6,1046.5 699.6,1031.5" fill="#274247"/>
<text x="725.6" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Bygger på</text>
<polyline points="835.2,1039.0 857.2,1039.0" fill="none" stroke="#5e787a" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/>
<polygon points="869.2,1039.0 853.2,1046.5 853.2,1031.5" fill="#5e787a"/>
<text x="879.2" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Påvirker</text>
<text x="1860" y="1046" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="end">25.11.2026 · Skisse til diskusjon · KI-gruppen, avdeling 700</text>
<rect x="60" y="200" width="200" height="766" rx="2" fill="#f2f0ff" stroke="#7e5ee8" stroke-width="1"/>
<rect x="60" y="200" width="200" height="5" rx="0" fill="#7e5ee8" stroke="none" stroke-width="0"/>
<text x="78" y="241.0" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#4b2fb0" text-anchor="start">KI-gruppen</text>
<text x="78" y="268.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">Koordinerer</text>
<text x="78" y="290.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">og holder</text>
<text x="78" y="312.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">oppdatert</text>
<rect x="300" y="200" width="520" height="200" rx="2" fill="#ffffff" stroke="#b9c5c6" stroke-width="1" stroke-dasharray="6 5"/>
<text x="318" y="237.0" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#5e787a" text-anchor="start">Felles verktøy</text>
<text x="318" y="264.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5e787a" text-anchor="start">Instruksjoner, skills, agenter</text>
<text x="318" y="286.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5e787a" text-anchor="start">og godkjente MCP-servere</text>
<rect x="860" y="200" width="520" height="200" rx="2" fill="#ffffff" stroke="#b9c5c6" stroke-width="1" stroke-dasharray="6 5"/>
<text x="878" y="237.0" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#5e787a" text-anchor="start">Innsikt</text>
<text x="878" y="264.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5e787a" text-anchor="start">Bruk, kostnad og erfaring.</text>
<text x="878" y="286.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5e787a" text-anchor="start">Nyheter hver måned.</text>
<rect x="300" y="450" width="520" height="230" rx="2" fill="#f0f8f9" stroke="#274247" stroke-width="1"/>
<rect x="300" y="450" width="520" height="5" rx="0" fill="#00824d" stroke="none" stroke-width="0"/>
<text x="318" y="491.0" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Kom i gang</text>
<text x="318" y="518.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">For utviklere</text>
<text x="318" y="540.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">For statistikere som koder</text>
<text x="318" y="562.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">Gode instruksjoner · Kontroll før bruk</text>
<rect x="860" y="450" width="520" height="230" rx="2" fill="#f0f8f9" stroke="#274247" stroke-width="1"/>
<rect x="860" y="450" width="520" height="5" rx="0" fill="#00824d" stroke="none" stroke-width="0"/>
<text x="878" y="491.0" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Bevisst bruk</text>
<text x="878" y="518.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">Grønn og rød sone</text>
<text x="878" y="540.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">KI-kompetanse etter</text>
<text x="878" y="562.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">KI-forordningen</text>
<rect x="300" y="736" width="1080" height="230" rx="2" fill="#f0f8f9" stroke="#274247" stroke-width="1"/>
<rect x="300" y="736" width="1080" height="5" rx="0" fill="#00824d" stroke="none" stroke-width="0"/>
<text x="318" y="777.0" font-family="Roboto, Arial, sans-serif" font-size="20" font-weight="700" fill="#274247" text-anchor="start">Retningslinjer</text>
<text x="318" y="804.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#274247" text-anchor="start">Hva er lov · Data og taushetsplikt · Ansvar · Agenter og isolasjon · Endringslogg</text>
