<text x="110" y="832" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#274247" text-anchor="start">Forstå hver linje · test som ville feilet · sjekk at funksjonene finnes · sammenlign med fasit · review</text>
