<text x="836" y="456" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#274247" text-anchor="start">Forklar og oversett</text>
<text x="836" y="482" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5e787a" text-anchor="start">arvet kode, SAS til Python</text>
