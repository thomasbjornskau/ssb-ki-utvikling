<text x="176" y="352" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#274247" text-anchor="start">Skaff tilgang</text>
<text x="176" y="378" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5e787a" text-anchor="start">lisens og modeller</text>
