<text x="836" y="664" font-family="Roboto, Arial, sans-serif" font-size="19" font-weight="700" fill="#274247" text-anchor="start">Faglige valg selv</text>
<text x="836" y="690" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5e787a" text-anchor="start">metode, plausibilitet, prikking</text>
