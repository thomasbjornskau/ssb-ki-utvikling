site_name: KI-utvikling i SSB
site_description: Regler, veiledning og felles verktøy for bruk av KI i utvikling og statistikkproduksjon i SSB. Skisse fra KI-gruppen i avdeling 700.
site_url: https://thomasbjornskau.github.io/ssb-ki-utvikling/
repo_url: https://github.com/thomasbjornskau/ssb-ki-utvikling
repo_name: ssb-ki-utvikling
use_directory_urls: false

theme:
  name: material
  language: nb
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Mørk visning
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Lys visning
  font:
    text: Open Sans
    code: Roboto Mono

extra_css:
  - stiler/ssb.css

plugins:
  - search:
      lang: ["no"]

markdown_extensions:
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.magiclink
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

nav:
  - Forside: index.md
  - Retningslinjer:
      - retningslinjer/index.md
      - Hva er lov, og hva er ikke lov: retningslinjer/tillatt.md
      - Data og taushetsplikt: retningslinjer/data.md
      - Ansvar: retningslinjer/ansvar.md
      - Agenter og isolasjon: retningslinjer/agenter.md
      - Endringslogg: retningslinjer/endringslogg.md
  - Kom i gang:
      - kom-i-gang/index.md
      - For utviklere: kom-i-gang/utvikler.md
      - For statistikere som koder: kom-i-gang/statistiker.md
      - Gode instruksjoner: kom-i-gang/instruksjoner.md
      - Kontroll før bruk: kom-i-gang/kontroll.md
  - Bevisst bruk:
      - bevisst-bruk/index.md
      - Grønn og rød sone: bevisst-bruk/soner.md
      - KI-kompetanse: bevisst-bruk/kompetanse.md
  - Felles verktøy:
      - katalog/index.md
      - Instruksjoner og skills: katalog/tilpasninger.md
      - MCP-servere: katalog/mcp.md
      - Slik bidrar du: katalog/bidra.md
  - Innsikt:
      - innsikt/index.md
      - Hva vi måler: innsikt/maling.md
      - Nyheter: innsikt/nyheter.md
  - Om:
      - om/index.md
      - Ordliste: om/ordliste.md
      - Figurer: figurer.md
