site_name: KI-utvikling i SSB · forslag v2.1
site_description: Versjon 2. Forslag til samlet struktur for ki-praksis og ssb-ki-utvikling. Skisse fra KI-gruppen i avdeling 700.
# site_url: https://thomasbjornskau.github.io/ssb-ki-utvikling/
# repo_url: https://github.com/thomasbjornskau/ssb-ki-utvikling
# repo_name: ssb-ki-utvikling
use_directory_urls: false

theme:
  name: material
  language: nb
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.highlight
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Mørk visning
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Lys visning
  font:
    text: Open Sans
    code: Roboto Mono

extra_css:
  - stiler/ssb.css

plugins:
  - search:
      lang: ["no"]

markdown_extensions:
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.magiclink
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

nav:
  - Forside: index.md
  - Om forslaget:
      - forslag/index.md
      - Samlet struktur: forslag/struktur.md
      - Endringer i ki-praksis: forslag/endringer.md
  - Regler:
      - regler/index.md
      - Verktøy og datanivå: regler/verktoy.md
      - Data og taushetsplikt: regler/data.md
      - Endringslogg: regler/endringslogg.md
  - Kom i gang:
      - kom-i-gang/index.md
  - Tilpasning:
      - tilpasning/index.md
      - Filer agentene leser: tilpasning/filer.md
  - Praksis:
      - praksis/index.md
  - Bevisst bruk:
      - bevisst-bruk/index.md
      - Grønn og rød sone: bevisst-bruk/soner.md
      - KI-kompetanse: bevisst-bruk/kompetanse.md
  - For statistikere:
      - statistikere/index.md
      - Utkast til inngang: statistikere/utkast.md
  - Nytt og innsikt:
      - innsikt/index.md
      - Hva vi måler: innsikt/maling.md
      - Nyheter: innsikt/nyheter.md
  - Om:
      - om/index.md
      - Ordliste: om/ordliste.md
      - Figurer: figurer.md
